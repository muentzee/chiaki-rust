[workspace]
resolver = "2"
members = [
    "crates/chiaki-core",
    "crates/chiaki-remote",
    "crates/chiaki-media",
    "crates/chiaki-render",
    "crates/chiaki-input",
    "crates/chiaki-settings",
    "crates/chiaki-ui",
    "crates/chiaki-app",
    "crates/chiaki-cli",
]

[workspace.package]
version = "1.10.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/muentzee/chiaki-rs"

[workspace.dependencies]
chiaki-core = { path = "crates/chiaki-core" }
chiaki-remote = { path = "crates/chiaki-remote" }
chiaki-media = { path = "crates/chiaki-media" }
chiaki-render = { path = "crates/chiaki-render" }
chiaki-input = { path = "crates/chiaki-input" }
chiaki-settings = { path = "crates/chiaki-settings" }
chiaki-ui = { path = "crates/chiaki-ui" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
prost = "0.13"
prost-build = "0.13"
bytes = "1"
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem"] }
k256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem"] }
rand = "0.8"
rand_chacha = "0.3"
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
url = "2"
base64 = "0.22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D11",
    "Win32_Media_Audio",
] }
gilrs = "0.11"
hidapi = "2.6"
vigem-client = "0.1"
sysinfo = "0.32"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
