[package]
name = "chiaki-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
# ChiakiResult/ChiakiError/Codec — die Medien-API nutzt dieselben Fehlertypen wie core
chiaki-core.workspace = true
# FFmpeg/libopus werden zur Laufzeit geladen (keine Linkzeit-Bindings, kein ffmpeg-sys)
libloading = "0.8"
num_enum = "0.7"
# WASAPI-Audio-Output/-Input (Mikrofon) — safe Rust, kein FFI nötig
cpal = "0.15"
# D3D11-Staging-Download für den Virtual-Cam-Feed (d3d11_copy, D3D11VA-Pfad)
windows.workspace = true

[dev-dependencies]
hex = "0.4"
tracing-subscriber.workspace = true
