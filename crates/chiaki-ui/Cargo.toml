[package]
name = "chiaki-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chiaki-core.workspace = true
chiaki-remote.workspace = true
chiaki-settings.workspace = true
chiaki-steam.workspace = true
chiaki-virtualcam.workspace = true
chiaki-media.workspace = true
chiaki-render.workspace = true
chiaki-input.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# gpui 0.2.2 von crates.io (DirectX-11-Backend, im Spike S1 verifiziert —
# siehe spike-s1-results.md). gpui re-exportiert das image-Crate nicht; die
# image-Version in chiaki-render (0.25.x) muss typidentisch bleiben.
gpui = "0.2.2"
# PSN-Login-WebView (psn_login.rs — C++: QtWebEngine-Login-Dialog).
wry = "0.44"
# Win32-Host-Fenster des PSN-Logins (Features im Workspace definiert).
windows.workspace = true

[[bin]]
name = "chiaki-ui"
path = "src/bin/chiaki_ui.rs"
