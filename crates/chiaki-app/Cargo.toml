[package]
name = "chiaki-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# lib+bin: das Binary (src/main.rs) braucht die Library für das
# chiaki-ui::run-Glue; chiaki-steam (Steam-Shortcuts) ist eigener Crate.
[lib]
name = "chiaki_app"
path = "src/lib.rs"

[[bin]]
name = "chiaki"
path = "src/main.rs"

[dependencies]
chiaki-core.workspace = true
chiaki-remote.workspace = true
chiaki-media.workspace = true
chiaki-render.workspace = true
chiaki-input.workspace = true
chiaki-settings.workspace = true
chiaki-steam.workspace = true
chiaki-virtualcam.workspace = true
chiaki-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
# Ctrl+C-Handling des Headless-Virtualcam-Modus (gleiche Crate wie chiaki-cli)
ctrlc = "3" 

# Prozess-Initialisierung des Binaries: HIGH_PRIORITY_CLASS wie gui/src/main.cpp
# (SetPriorityClass, Win32_System_Threading — Features kommen aus der
# Workspace-Dep, dort nur Ergänzungen, keine Entfernung).
windows.workspace = true

[build-dependencies]
winresource = "0.1"
